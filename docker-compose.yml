services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: journey-forensics-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: "production"
      LOG_LEVEL: "INFO"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000"
    container_name: journey-forensics-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped